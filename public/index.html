<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คลังวิธีแก้ปัญหา HIS</title>
<script>
  // set the saved theme before the page paints, so it never flashes the wrong colours
  try { var t = localStorage.getItem("kb-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in gutter">
    <a class="logo" href="#" id="homeLink"><span class="logo-mark" aria-hidden="true">?</span><span>คลังวิธีแก้ปัญหา HIS</span></a>
    <nav class="nav" id="nav" aria-label="เมนูหลัก">
      <a href="#" data-nav="home">ค้นหา</a>
      <a href="#all" data-nav="all">บทความทั้งหมด</a>
      <a href="#overview" data-nav="overview" data-team hidden>ภาพรวมปัญหา</a>
    </nav>
    <div class="top-actions">
      <div class="proj" id="projWrap" hidden><label for="f-project" class="sr">โครงการ</label><select id="f-project" title="โครงการ"></select></div>
      <button class="btn primary" id="addBtn" hidden>+ บันทึกวิธีแก้</button>
      <button class="btn icon" id="themeBtn" type="button"></button>
      <button class="btn" id="loginBtn">เข้าสู่ระบบทีม</button>
      <div class="menu" id="acctMenu" hidden>
        <button class="btn" id="acctBtn" aria-haspopup="true" aria-expanded="false"><span id="acctName">บัญชี</span> ▾</button>
        <div class="menu-list" id="acctList" hidden>
          <div class="who" id="whoami"></div>
          <label class="menu-check"><input type="checkbox" id="userView"> ดูแบบที่ User เห็น</label>
          <button id="mPassword">เปลี่ยนรหัสผ่าน</button>
          <button id="mUsers" data-admin>จัดการผู้ใช้</button>
          <div class="menu-sep" data-admin></div>
          <button id="mSync" data-admin>เชื่อมต่อระบบรับแจ้งปัญหา (API)</button>
          <button id="mImportCases" data-admin>นำเข้าเคสจาก Excel</button>
          <button id="mImportHosp" data-admin>นำเข้ารายชื่อสถานพยาบาล</button>
          <button id="mImport" data-admin>นำเข้าบทความ (JSON)</button>
          <button id="mExport">ดาวน์โหลดข้อมูลสำรอง (JSON)</button>
          <div class="menu-sep"></div>
          <button id="mLogout">ออกจากระบบ</button>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="searcharea gutter" id="searchArea">
  <div class="search-wrap">
    <h1 class="hero-q" id="heroQ">User แจ้งว่าอะไร?</h1>
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="พิมพ์อาการ คำที่ User ใช้ หรือข้อความ Error" autocomplete="off" aria-label="ค้นหาวิธีแก้">
      <kbd class="kbd" title="กด / เพื่อค้นหา">/</kbd>
    </div>
    <div class="examples" id="examples"></div>
  </div>
</section>

<main class="view gutter" id="view"></main>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="norm.js"></script>
<script src="app.js"></script>
</body>
</html>
